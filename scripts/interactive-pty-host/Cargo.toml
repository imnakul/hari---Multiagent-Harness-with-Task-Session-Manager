[package]
name = "interactive-pty-host"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated opt-in test plumbing, not an application workspace member.
[workspace]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
portable-pty = { version = "0.9", path = "../../vendor/portable-pty" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
