<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hari — One harness for everything you build</title>
    <meta name="description" content="Hari runs Claude Code, Codex, Antigravity and more side by side, with a browser, whiteboard, tasks, notes, automations, activity tracking and a phone app that controls your PC. 25 MB on Windows, 70 MB on Android." />
    <meta name="theme-color" content="#06161a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef4f3" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Hari — One harness for everything you build" />
    <meta property="og:description" content="Agents, browser, whiteboard, tasks, notes, automations and your phone — in one glass window." />
    <meta property="og:image" content="/brand/og.jpg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("hari-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
